# PREPPY LOSERS — nginx reverse proxy with TLS
# Place in /etc/nginx/sites-available/preppylosers.com
# Symlink: ln -s .../preppylosers.com /etc/nginx/sites-enabled/

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name preppylosers.com www.preppylosers.com;
    return 301 https://preppylosers.com$request_uri;
}

# www → apex redirect
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.preppylosers.com;

    ssl_certificate     /etc/letsencrypt/live/preppylosers.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/preppylosers.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://preppylosers.com$request_uri;
}

# Primary HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name preppylosers.com;

    ssl_certificate     /etc/letsencrypt/live/preppylosers.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/preppylosers.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers (Next.js also sets these — nginx adds defense in depth)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # Gzip at nginx layer (Next.js also compresses)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Cache immutable Next.js static assets at nginx (optional)
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
